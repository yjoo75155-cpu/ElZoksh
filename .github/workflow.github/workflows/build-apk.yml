name: Build Android APK - V11

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    name: Build Yawmeyat ElZoksh V11
    runs-on: ubuntu-latest

    steps:

      # =========================
      # 1. Checkout
      # =========================
      - name: Checkout repository
        uses: actions/checkout@v4


      # =========================
      # 2. Java
      # =========================
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'


      # =========================
      # 3. Android SDK
      # =========================
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3


      - name: Install Android SDK
        run: |
          yes | sdkmanager --licenses || true

          sdkmanager \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"


      # =========================
      # 4. Find and extract ZIP
      # =========================
      - name: Extract existing project
        run: |
          set -e

          mkdir -p project

          ZIP_FILE=$(find . -maxdepth 2 -type f -name "Yawmeyat*.zip" | head -n 1)

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: No Yawmeyat ZIP file found."
            exit 1
          fi

          echo "Using ZIP:"
          echo "$ZIP_FILE"

          unzip -q "$ZIP_FILE" -d project

          echo "Project files:"
          find project -maxdepth 4 -type f | head -100


      # =========================
      # 5. Detect Android project
      # =========================
      - name: Detect Android project
        run: |
          set -e

          if [ -d "project/android/app" ]; then
            echo "ANDROID_ROOT=project/android" >> "$GITHUB_ENV"
            echo "Detected: project/android"

          elif [ -d "project/app" ]; then
            echo "ANDROID_ROOT=project" >> "$GITHUB_ENV"
            echo "Detected: project"

          elif [ -d "project/*/app" ]; then
            ROOT=$(find project -mindepth 2 -maxdepth 2 -type d -name app | head -n 1 | xargs dirname)

            echo "ANDROID_ROOT=$ROOT" >> "$GITHUB_ENV"
            echo "Detected: $ROOT"

          else
            echo "ERROR: Android app directory not found."

            echo "Searching:"
            find project -type d -name app -print

            exit 1
          fi


      # =========================
      # 6. Patch MainActivity
      # =========================
      - name: Fix Android WebView
        run: |
          set -e

          MAIN="$ANDROID_ROOT/app/src/main/java/com/zoksh/yawmeyat/MainActivity.java"

          if [ ! -f "$MAIN" ]; then
            echo "ERROR: MainActivity.java not found:"
            echo "$MAIN"
            exit 1
          fi

          cat > "$MAIN" <<'JAVA'
package com.zoksh.yawmeyat;

import android.app.Activity;
import android.os.Build;
import android.os.Bundle;
import android.provider.Settings;
import android.content.Intent;
import android.net.Uri;
import android.graphics.Color;
import android.webkit.JavascriptInterface;
import android.webkit.WebSettings;
import android.webkit.WebView;
import android.webkit.WebViewClient;
import android.webkit.WebResourceRequest;
import android.webkit.WebResourceResponse;

import androidx.webkit.WebViewAssetLoader;

public class MainActivity extends Activity {

    private WebView web;

    @Override
    protected void onCreate(Bundle b) {
        super.onCreate(b);

        web = new WebView(this);

        web.setBackgroundColor(
            Color.rgb(16, 6, 34)
        );

        WebSettings settings = web.getSettings();

        settings.setJavaScriptEnabled(true);
        settings.setDomStorageEnabled(true);
        settings.setDatabaseEnabled(true);

        settings.setAllowFileAccess(false);
        settings.setAllowContentAccess(false);

        settings.setLoadsImagesAutomatically(true);
        settings.setMediaPlaybackRequiresUserGesture(false);

        final WebViewAssetLoader loader =
            new WebViewAssetLoader.Builder()
                .addPathHandler(
                    "/assets/",
                    new WebViewAssetLoader.AssetsPathHandler(this)
                )
                .build();

        web.setWebViewClient(
            new WebViewClient() {

                @Override
                public WebResourceResponse shouldInterceptRequest(
                    WebView view,
                    WebResourceRequest request
                ) {
                    return loader.shouldInterceptRequest(
                        request.getUrl()
                    );
                }

                @Override
                public WebResourceResponse shouldInterceptRequest(
                    WebView view,
                    String url
                ) {
                    return loader.shouldInterceptRequest(
                        Uri.parse(url)
                    );
                }
            }
        );

        web.addJavascriptInterface(
            new AndroidBridge(),
            "ZokshAndroid"
        );

        // مهم جدًا:
        // بدون السطر ده التطبيق ممكن يفتح شاشة فاضية.
        setContentView(web);

        web.loadUrl(
            "https://appassets.androidplatform.net/assets/www/index.html"
        );

        if (
            Build.VERSION.SDK_INT >= 33 &&
            checkSelfPermission(
                "android.permission.POST_NOTIFICATIONS"
            ) != 0
        ) {
            requestPermissions(
                new String[]{
                    "android.permission.POST_NOTIFICATIONS"
                },
                100
            );
        }
    }


    public class AndroidBridge {

        @JavascriptInterface
        public void scheduleReminder(
            int id,
            long timeMs,
            String title,
            String text
        ) {
            ReminderScheduler.schedule(
                MainActivity.this,
                id,
                timeMs,
                title,
                text
            );
        }


        @JavascriptInterface
        public void cancelReminder(
            int id
        ) {
            ReminderScheduler.cancel(
                MainActivity.this,
                id
            );
        }


        @JavascriptInterface
        public void saveReminders(
            String json
        ) {
            getSharedPreferences(
                ReminderScheduler.PREF,
                MODE_PRIVATE
            )
            .edit()
            .putString(
                "items",
                json
            )
            .apply();
        }


        @JavascriptInterface
        public void requestExactAlarmPermission() {

            if (Build.VERSION.SDK_INT >= 31) {

                try {

                    startActivity(
                        new Intent(
                            Settings.ACTION_REQUEST_SCHEDULE_EXACT_ALARM,
                            Uri.parse(
                                "package:" +
                                getPackageName()
                            )
                        )
                    );

                } catch (Exception ignored) {
                }
            }
        }
    }


    @Override
    public void onBackPressed() {

        if (
            web != null &&
            web.canGoBack()
        ) {

            web.goBack();

        } else {

            super.onBackPressed();
        }
    }
}
JAVA

          echo "MainActivity fixed successfully."


      # =========================
      # 7. Add WebKit dependency
      # =========================
      - name: Add AndroidX WebKit
        run: |
          set -e

          GRADLE="$ANDROID_ROOT/app/build.gradle"

          if [ ! -f "$GRADLE" ]; then
            echo "ERROR: build.gradle not found:"
            echo "$GRADLE"
            exit 1
          fi

          if ! grep -q "androidx.webkit:webkit" "$GRADLE"; then

            cat >> "$GRADLE" <<'GRADLE'

dependencies {
    implementation 'androidx.webkit:webkit:1.12.1'
}
GRADLE

          fi

          echo "WebKit dependency ready."


      # =========================
      # 8. Fix Chat Renderer
      # =========================
      - name: Fix JavaScript
        run: |
          set -e

          HTML=$(find "$ANDROID_ROOT" -type f -name "index.html" | head -n 1)

          JS=$(find "$ANDROID_ROOT" -type f -name "app.js" | head -n 1)

          echo "HTML:"
          echo "$HTML"

          echo "JS:"
          echo "$JS"

          if [ -z "$JS" ]; then
            echo "WARNING: app.js not found."
            exit 0
          fi

          if ! grep -q "function renderChat" "$JS"; then

            cat >> "$JS" <<'JS'

/* V11 safety patch */

function renderChat(){

    const el = document.getElementById("chat");

    if(!el){
        return;
    }

    const items =
        Array.isArray(data?.chat)
        ? data.chat
        : [];

    el.innerHTML =
        items.map(function(m){

            return `
                <div class="msg ${m.w === "u" ? "u" : "b"}">
                    ${m.t || ""}
                </div>
            `;

        }).join("");

    el.scrollTop =
        el.scrollHeight;
}
JS

          fi

          node --check "$JS"

          echo "JavaScript syntax check passed."


      # =========================
      # 9. Validate Android files
      # =========================
      - name: Validate project
        run: |
          set -e

          echo "Android root:"
          echo "$ANDROID_ROOT"

          test -f "$ANDROID_ROOT/app/build.gradle"

          test -f "$ANDROID_ROOT/app/src/main/java/com/zoksh/yawmeyat/MainActivity.java"

          echo "Android project validation passed."


      # =========================
      # 10. Install Gradle
      # =========================
      - name: Install Gradle 8.7
        run: |
          set -e

          curl -L \
            -o /tmp/gradle.zip \
            https://services.gradle.org/distributions/gradle-8.7-bin.zip

          unzip -q \
            /tmp/gradle.zip \
            -d /tmp

          /tmp/gradle-8.7/bin/gradle --version


      # =========================
      # 11. Build APK
      # =========================
      - name: Build APK
        run: |
          set -e

          cd "$ANDROID_ROOT"

          /tmp/gradle-8.7/bin/gradle \
            assembleDebug \
            --stacktrace \
            --no-daemon

          echo ""
          echo "APK files:"
          find app/build/outputs -type f -name "*.apk" -print


      # =========================
      # 12. Upload APK
      # =========================
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Yawmeyat-ElZoksh-V11
          path: |
            project/**/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
