          MAN="$ROOT/app/src/main/AndroidManifest.xml"

          python3 - "$MAN" <<'PY'
          from pathlib import Path
          import sys

          p = Path(sys.argv[1])

          s = p.read_text()

          permissions = [
              'android.permission.POST_NOTIFICATIONS',
              'android.permission.RECEIVE_BOOT_COMPLETED',
              'android.permission.SCHEDULE_EXACT_ALARM'
          ]

          for perm in permissions:

              tag = (
                  f'<uses-permission '
                  f'android:name="{perm}"/>'
              )

              if perm not in s:

                  s = s.replace(
                      '<application',
                      tag +
                      '\n    <application',
                      1
                  )

          if 'android:usesCleartextTraffic' not in s:

              s = s.replace(
                  '<application ',
                  '<application '
                  'android:usesCleartextTraffic="true" ',
                  1
              )

          p.write_text(s)

