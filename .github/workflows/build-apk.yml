name: Build يوميات الزوكش V11

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
  uses: actions/setup-java@v5
  with:
    distribution: temurin
    java-version: '17'
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK
        run: |
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Extract existing project ZIP
        shell: bash
        run: |
          set -e

          ZIP=$(find . -maxdepth 1 -type f -name 'Yawmeyat*.zip' \
            -printf '%T@ %p\n' |
            sort -nr |
            head -1 |
            cut -d' ' -f2-)

          [ -n "$ZIP" ] || {
            echo "No Yawmeyat*.zip found in repository"
            exit 1
          }

          rm -rf project
          mkdir project

          unzip -q "$ZIP" -d project

          echo "Using ZIP: $ZIP"

          find project -maxdepth 4 -type f | head -80

      - name: Build V11 web app + Android bridge
        working-directory: project
        shell: bash
        run: |
          set -e

          ROOT="."

          if [ -d android ]; then
            ROOT="android"
          fi

          WWW="$ROOT/app/src/main/assets/www"

          if [ ! -d "$WWW" ]; then
            echo "Web assets folder not found:"
            echo "$WWW"
            exit 1
          fi

          mkdir -p "$WWW"

          cat > "$WWW/index.html" <<'HTML'
          <!doctype html>
          <html lang="ar" dir="rtl">

          <head>

          <meta charset="utf-8">

          <meta
            name="viewport"
            content="width=device-width,
            initial-scale=1,
            viewport-fit=cover,
            user-scalable=no">

          <meta
            name="theme-color"
            content="#140b2e">

          <title>يوميات الزوكش</title>

          <style>

          :root{
            --bg:#100821;
            --panel:#1a1035;
            --panel2:#24164a;
            --line:#4a3181;
            --p:#8b45ff;
            --p2:#b56cff;
            --cyan:#35e5d0;
            --green:#27e69b;
            --yellow:#ffd24a;
            --red:#ff6688;
            --text:#fff;
            --muted:#bdb2d8;
            --r:20px
          }

          *{
            box-sizing:border-box;
            -webkit-tap-highlight-color:transparent
          }

          body{
            margin:0;
            background:
              radial-gradient(
                circle at 50% -10%,
                #402079 0,
                #170d31 38%,
                var(--bg) 72%
              );
            color:var(--text);
            font-family:
              system-ui,
              -apple-system,
              "Segoe UI",
              Tahoma,
              Arial,
              sans-serif;
            min-height:100vh
          }

          button,
          input,
          select,
          textarea{
            font:inherit
          }

          button{
            border:0;
            color:white;
            cursor:pointer
          }

          .app{
            max-width:520px;
            margin:auto;
            min-height:100vh;
            padding:12px 12px 92px
          }

          .top{
            display:flex;
            align-items:center;
            justify-content:space-between;
            padding:7px 4px 14px
          }

          .brand{
            font-size:23px;
            font-weight:900
          }

          .iconbtn{
            width:42px;
            height:42px;
            border-radius:14px;
            background:#211342;
            border:1px solid #53358e;
            font-size:21px
          }

          .hero{
            padding:18px;
            border-radius:26px;
            background:
              linear-gradient(
                145deg,
                #2c1756,
                #17102f
              );
            border:1px solid #6841a8;
            box-shadow:0 15px 45px #0005
          }

          .hero h1{
            margin:0 0 7px;
            font-size:22px
          }

          .muted{
            color:var(--muted);
            font-size:13px
          }

          .grid{
            display:grid;
            grid-template-columns:1fr 1fr;
            gap:10px;
            margin-top:11px
          }

          .card{
            background:
              linear-gradient(
                145deg,
                #211440,
                #18102f
              );
            border:1px solid #493078;
            border-radius:18px;
            padding:14px
          }

          .stat{
            min-height:92px
          }

          .stat .n{
            font-size:23px;
            font-weight:900;
            margin-top:5px
          }

          .cyan{color:var(--cyan)}
          .green{color:var(--green)}
          .yellow{color:var(--yellow)}
          .pink{color:#ff70ad}

          .section{
            margin-top:16px
          }

          .sectionhead{
            display:flex;
            justify-content:space-between;
            align-items:center;
            margin-bottom:9px
          }

          .sectionhead h2{
            font-size:17px;
            margin:0
          }

          .link{
            color:var(--p2);
            font-size:13px;
            background:none
          }

          .item{
            display:flex;
            align-items:center;
            gap:11px;
            padding:12px;
            border-radius:16px;
            background:#1b1135;
            border:1px solid #3c2868;
            margin:8px 0
          }

          .check{
            width:25px;
            height:25px;
            border-radius:50%;
            border:2px solid #8d76b9;
            display:grid;
            place-items:center;
            flex:none
          }

          .check.done{
            background:var(--green);
            border-color:var(--green);
            color:#0d1630
          }

          .itemmain{
            flex:1
          }

          .itemtitle{
            font-weight:700
          }

          .bar{
            height:8px;
            border-radius:99px;
            background:#332253;
            overflow:hidden;
            margin-top:8px
          }

          .bar i{
            display:block;
            height:100%;
            border-radius:99px;
            background:
              linear-gradient(
                90deg,
                var(--p),
                var(--cyan)
              );
            width:0
          }

          .pill{
            display:inline-flex;
            padding:6px 10px;
            border-radius:99px;
            background:#29184d;
            color:#ddd1f2;
            font-size:12px;
            border:1px solid #4a3181
          }

          .fab{
            position:fixed;
            right:calc(50% - 240px);
            bottom:82px;
            width:58px;
            height:58px;
            border-radius:20px;
            background:
              linear-gradient(
                145deg,
                #a14cff,
                #6420e8
              );
            font-size:30px;
            box-shadow:
              0 10px 30px #6d2bff77
          }

          .bottom{
            position:fixed;
            bottom:0;
            left:50%;
            transform:translateX(-50%);
            width:min(520px,100%);
            display:grid;
            grid-template-columns:repeat(5,1fr);
            gap:4px;
