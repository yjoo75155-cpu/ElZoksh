          s = p.read_text()

          s = re.sub(
              r'versionCode\s+\d+',
              'versionCode 13',
              s
          )

          s = re.sub(
              r"versionName\s+'[^']+'",
              "versionName '11.0'",
              s
          )

          p.write_text(s)

