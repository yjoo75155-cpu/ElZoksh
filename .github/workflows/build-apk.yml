              8px
              8px
              calc(8px + env(safe-area-inset-bottom));
            background:#130a28ee;
            backdrop-filter:blur(18px);
            border-top:1px solid #432a70
          }

          .nav{
            background:none;
            color:#998db7;
            font-size:11px;
            padding:7px 2px;
            border-radius:14px
          }

          .nav b{
            display:block;
            font-size:20px;
            margin-bottom:2px
          }

          .nav.active{
            color:#d18aff;
            background:#271448
          }

          .screen{
            display:none
