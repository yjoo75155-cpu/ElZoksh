name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android
        uses: android-actions/setup-android@v3

      - name: Install Android SDK
        run: |
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Extract project
        run: |
          mkdir project
          unzip -q Yawmeyat*.zip -d project

      - name: Fix Android WebView
        working-directory: project
        run: |
          python3 <<'PY'
          from pathlib import Path

          gradle = Path("android/app/build.gradle")
          text = gradle.read_text()

          if "androidx.webkit:webkit" not in text:
              text = text.replace(
                  "plugins { id 'com.android.application' }",
                  """plugins { id 'com.android.application' }

          dependencies {
              implementation 'androidx.webkit:webkit:1.12.1'
          }"""
              )

          gradle.write_text(text)

          main = Path("android/app/src/main/java/com/zoksh/yawmeyat/MainActivity.java")

          java = r'''package com.zoksh.yawmeyat;

          import android.app.Activity;
          import android.os.Build;
          import android.os.Bundle;
          import android.provider.Settings;
          import android.content.Intent;
          import android.net.Uri;
          import android.graphics.Color;
          import android.view.View;
          import android.webkit.JavascriptInterface;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;
          import android.webkit.WebResourceRequest;
          import android.webkit.WebResourceResponse;

          import androidx.webkit.WebViewAssetLoader;

          public class MainActivity extends Activity {

              private WebView web;

              @Override
              public void onCreate(Bundle b) {
                  super.onCreate(b);

                  web = new WebView(this);
                  web.setBackgroundColor(Color.rgb(16, 6, 34));

                  WebSettings s = web.getSettings();
                  s.setJavaScriptEnabled(true);
                  s.setDomStorageEnabled(true);
                  s.setDatabaseEnabled(true);
                  s.setAllowFileAccess(false);
                  s.setAllowContentAccess(false);
                  s.setBuiltInZoomControls(false);
                  s.setDisplayZoomControls(false);
                  s.setLoadsImagesAutomatically(true);
                  s.setMediaPlaybackRequiresUserGesture(false);

                  final WebViewAssetLoader assetLoader =
                      new WebViewAssetLoader.Builder()
                          .addPathHandler(
                              "/assets/",
                              new WebViewAssetLoader.AssetsPathHandler(this)
                          )
                          .build();

                  web.setWebViewClient(new WebViewClient() {
                      @Override
                      public WebResourceResponse shouldInterceptRequest(
                              WebView view,
                              WebResourceRequest request
                      ) {
                          return assetLoader.shouldInterceptRequest(request.getUrl());
                      }

                      @Override
                      public WebResourceResponse shouldInterceptRequest(
                              WebView view,
                              String url
                      ) {
                          return assetLoader.shouldInterceptRequest(Uri.parse(url));
                      }
                  });

                  web.addJavascriptInterface(new AndroidBridge(), "ZokshAndroid");

                  setContentView(web);

                  web.loadUrl(
                      "https://appassets.androidplatform.net/assets/www/index.html"
                  );

                  if (Build.VERSION.SDK_INT >= 33 &&
                      checkSelfPermission(
                          "android.permission.POST_NOTIFICATIONS"
                      ) != 0) {
                      requestPermissions(
                          new String[]{"android.permission.POST_NOTIFICATIONS"},
                          100
                      );
                  }
              }

              public class AndroidBridge {

                  @JavascriptInterface
                  public void scheduleReminder(
                          int id,
                          long timeMs,
                          String title,
                          String text
                  ) {
                      ReminderScheduler.schedule(
                          MainActivity.this,
                          id,
                          timeMs,
                          title,
                          text
                      );
                  }

                  @JavascriptInterface
                  public void cancelReminder(int id) {
                      ReminderScheduler.cancel(
                          MainActivity.this,
                          id
                      );
                  }

                  @JavascriptInterface
                  public void saveReminders(String json) {
                      getSharedPreferences(
                          ReminderScheduler.PREF,
                          MODE_PRIVATE
                      ).edit()
                       .putString("items", json)
                       .apply();
                  }

                  @JavascriptInterface
                  public void requestExactAlarmPermission() {
                      if (Build.VERSION.SDK_INT >= 31) {
                          try {
                              Intent i = new Intent(
                                  Settings.ACTION_REQUEST_SCHEDULE_EXACT_ALARM,
                                  Uri.parse("package:" + getPackageName())
                              );
                              startActivity(i);
                          } catch (Exception ignored) {
                          }
                      }
                  }
              }

              @Override
              public void onBackPressed() {
                  if (web != null && web.canGoBack()) {
                      web.goBack();
                  } else {
                      super.onBackPressed();
                  }
              }
          }
          '''

          main.write_text(java)
          PY

      - name: Build APK
        working-directory: project/android
        run: |
          curl -L -o /tmp/gradle.zip \
            https://services.gradle.org/distributions/gradle-8.7-bin.zip

          unzip -q /tmp/gradle.zip -d /tmp

          /tmp/gradle-8.7/bin/gradle \
            assembleDebug \
            --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Yawmeyat-ElZoksh-V10.2-FIXED
          path: project/android/app/build/outputs/apk/debug/app-debug.apk
