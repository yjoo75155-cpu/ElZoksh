name: Build Android APK V11

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest

    steps:

      # =========================================
      # 1. تحميل المشروع
      # =========================================

      - name: Checkout repository
        uses: actions/checkout@v4


      # =========================================
      # 2. Java 17
      # =========================================

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'


      # =========================================
      # 3. Android SDK
      # =========================================

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3


      - name: Install Android SDK
        shell: bash
        run: |
          set -euo pipefail

          sdkmanager "platform-tools"
          sdkmanager "platforms;android-35"
          sdkmanager "build-tools;35.0.0"


      # =========================================
      # 4. استخراج ZIP واكتشاف مشروع Android
      # =========================================

      - name: Extract Android project
        shell: bash
        run: |
          set -euo pipefail

          echo "======================================"
          echo "Searching for Yawmeyat ZIP..."
          echo "======================================"

          ZIP="$(find . -type f -name 'Yawmeyat*.zip' -print -quit)"

          if [ -z "$ZIP" ]; then
            echo "ERROR: Yawmeyat ZIP was not found."
            echo ""
            echo "Files in repository:"
            find . -maxdepth 4 -type f -print | sort
            exit 1
          fi

          echo "ZIP FOUND:"
          echo "$ZIP"

          rm -rf project
          mkdir -p project

          echo ""
          echo "Extracting..."

          unzip -q "$ZIP" -d project

          echo ""
          echo "Searching for settings.gradle..."

          SETTINGS="$(find project -type f -name 'settings.gradle' -print -quit)"

          if [ -z "$SETTINGS" ]; then
            echo "ERROR: settings.gradle was not found."

            echo ""
            echo "Extracted files:"
            find project -maxdepth 8 -type f -print | sort

            exit 1
          fi

          ANDROID_ROOT="$(dirname "$SETTINGS")"

          APP_DIR="$ANDROID_ROOT/app"

          WEB_DIR="$APP_DIR/src/main/assets/www"

          echo ""
          echo "======================================"
          echo "PROJECT DETECTED"
          echo "======================================"

          echo "ANDROID_ROOT:"
          echo "$ANDROID_ROOT"

          echo ""
          echo "APP_DIR:"
          echo "$APP_DIR"

          echo ""
          echo "WEB_DIR:"
          echo "$WEB_DIR"

          echo ""
          echo "Checking required files..."

          test -f "$ANDROID_ROOT/settings.gradle"

          test -f "$ANDROID_ROOT/build.gradle"

          test -f "$APP_DIR/build.gradle"

          test -f "$APP_DIR/src/main/AndroidManifest.xml"

          test -f "$APP_DIR/src/main/java/com/zoksh/yawmeyat/MainActivity.java"

          test -f "$WEB_DIR/index.html"

          test -f "$WEB_DIR/app.js"

          test -f "$WEB_DIR/style.css"

          echo ""
          echo "ALL REQUIRED FILES FOUND."

          echo "ANDROID_ROOT=$ANDROID_ROOT" >> "$GITHUB_ENV"

          echo "APP_DIR=$APP_DIR" >> "$GITHUB_ENV"

          echo "WEB_DIR=$WEB_DIR" >> "$GITHUB_ENV"


      # =========================================
      # 5. V11 UI
      # =========================================

      - name: Upgrade Web App to V11
        shell: bash
        run: |
          set -euo pipefail

          python3 <<'PY'
          import os
          import re
          from pathlib import Path

          web = Path(os.environ["WEB_DIR"])
          app = Path(os.environ["APP_DIR"])

          # =====================================
          # HTML
          # =====================================

          index_file = web / "index.html"

          html = index_file.read_text(
              encoding="utf-8"
          )

          html = re.sub(
              r"<title>.*?</title>",
              "<title>يوميات الزوكش V11</title>",
              html,
              count=1,
              flags=re.S
          )

          # Notification button

          if 'id="v11Bell"' not in html:

              marker = '<div class="topActions">'

              if marker in html:

                  bell = '''
          <button
            id="v11Bell"
            onclick="openV11Notifications()"
            aria-label="الإشعارات">
            🔔
            <span id="v11Badge">0</span>
          </button>
          '''

                  html = html.replace(
                      marker,
                      marker + bell,
                      1
                  )


          # Daily progress

          if 'id="v11Daily"' not in html:

              marker = "<main>"

              if marker in html:

                  daily = '''
          <section
            id="v11Daily"
            style="
              margin:12px 0;
              padding:15px 16px;
              border-radius:22px;
              background:
                linear-gradient(
                  135deg,
                  rgba(124,77,255,.28),
                  rgba(255,64,145,.14)
                );
              border:
                1px solid
                rgba(255,255,255,.10);
              box-shadow:
                0 12px 35px
                rgba(0,0,0,.22);
            ">

            <div style="
              display:flex;
              justify-content:space-between;
              align-items:center;
              gap:12px;
            ">

              <div>

                <small style="
                  opacity:.7;
                ">
                  يومك النهارده
                </small>

                <div
                  id="v11Date"
                  style="
                    font-weight:800;
                    margin-top:4px;
                  ">
                  —
                </div>

              </div>

              <div style="
                flex:1;
                max-width:180px;
                height:8px;
                border-radius:99px;
                background:
                  rgba(255,255,255,.08);
                overflow:hidden;
              ">

                <span
                  id="v11Progress"
                  style="
                    display:block;
                    width:0;
                    height:100%;
                    border-radius:99px;
                    background:
                      linear-gradient(
                        90deg,
                        #7c4dff,
                        #ff4d9d
                      );
                  ">
                </span>

              </div>

              <b id="v11Percent">
                0%
              </b>

            </div>

          </section>
          '''

                  html = html.replace(
                      marker,
                      marker + daily,
                      1
                  )


          # Notification modal

          if 'id="v11NotifyModal"' not in html:

              modal = '''
          <div
            id="v11NotifyModal"
            hidden
            style="
              position:fixed;
              inset:0;
              z-index:99999;
              background:
                rgba(0,0,0,.70);
              backdrop-filter:
                blur(8px);
              padding:18px;
              place-items:center;
            ">

            <div style="
              width:min(100%,420px);
              max-height:80vh;
              overflow:auto;
              border-radius:24px;
              padding:18px;
              background:#160d25;
              border:
                1px solid
                rgba(255,255,255,.10);
              box-shadow:
                0 20px 70px
                rgba(0,0,0,.5);
            ">

              <div style="
                display:flex;
                justify-content:space-between;
                align-items:center;
                margin-bottom:14px;
              ">

                <b>
                  🔔 إشعارات الزوكش
                </b>

                <button
                  onclick="closeV11Notifications()">
                  ✕
                </button>

              </div>

              <div id="v11NotifyBody"></div>

            </div>

          </div>
          '''

              html = html.replace(
                  "</body>",
                  modal + "</body>",
                  1
              )


          index_file.write_text(
              html,
              encoding="utf-8"
          )


          # =====================================
          # CSS
          # =====================================

          css_file = web / "style.css"

          css = css_file.read_text(
              encoding="utf-8"
          )

          css += r'''

          /* =====================================
             ZOKSH V11
             ===================================== */

          #v11Bell {
            position:relative;
          }

          #v11Badge {
            position:absolute;
            top:-5px;
            right:-5px;

            min-width:18px;
            height:18px;

            padding:0 4px;

            display:none;

            align-items:center;
            justify-content:center;

            border-radius:99px;

            background:#ff4d8d;
            color:#fff;

            font-size:10px;
            font-weight:800;
          }

          #v11NotifyModal[hidden] {
            display:none !important;
          }

          #v11NotifyModal:not([hidden]) {
            display:grid !important;
          }

          .v11-notice {
            padding:13px;

            border-radius:16px;

            background:
              rgba(255,255,255,.055);

            margin:8px 0;
          }

          .v11-notice b {
            display:block;
          }

          .v11-notice small {
            display:block;
            opacity:.72;
            margin-top:5px;
          }

          '''

          css_file.write_text(
              css,
              encoding="utf-8"
          )


          # =====================================
          # JavaScript
          # =====================================

          js_file = web / "app.js"

          js = js_file.read_text(
              encoding="utf-8"
          )

          if "function openV11Notifications()" not in js:

              js += r'''

          // ==========================================
          // ZOKSH V11 NOTIFICATIONS
          // ==========================================

          function openV11Notifications(){

            const modal =
              document.getElementById(
                "v11NotifyModal"
              );

            const body =
              document.getElementById(
                "v11NotifyBody"
              );

            if(!modal || !body){
              return;
            }

            const now =
              new Date();

            const notes = [];

            const tasks =
              (window.data &&
               data.tasks) || [];

            const installments =
              (window.data &&
               data.installments) || [];


            const todayStr =
              new Date()
                .toISOString()
                .slice(0,10);


            const todayTasks =
              tasks.filter(
                x => x.date === todayStr
              );


            const done =
              todayTasks.filter(
                x => x.done
              ).length;


            if(todayTasks.length){

              notes.push(`

                <div class="v11-notice">

                  <b>
                    📋 مهام اليوم
                  </b>

                  <small>
                    أنجزت
                    ${done}
                    من
                    ${todayTasks.length}
                    مهمة.
                  </small>

                </div>

              `);

            }


            installments.forEach(x => {

              const d =
                new Date(
                  x.due || ""
                );

              if(
                !isNaN(d) &&
                d >= now &&
                d - now <
                4 * 86400000
              ){

                notes.push(`

                  <div class="v11-notice">

                    <b>
                      💳 قسط قريب
                    </b>

                    <small>
                      ${String(
                        x.name ||
                        "قسط"
                      )}
                      —
                      ${String(
                        x.amount ||
                        0
                      )}
                      جنيه.
                    </small>

                  </div>

                `);

              }

            });


            body.innerHTML =
              notes.length
              ? notes.join("")
              : `

                <div class="v11-notice">

                  <b>
                    ✨ كله تمام
                  </b>

                  <small>
                    مفيش تنبيهات مهمة دلوقتي.
                  </small>

                </div>

              `;


            modal.hidden = false;

          }


          function closeV11Notifications(){

            const modal =
              document.getElementById(
                "v11NotifyModal"
              );

            if(modal){

              modal.hidden = true;

            }

          }


          function updateV11Dashboard(){

            try{

              const tasks =
                (window.data &&
                 data.tasks) || [];


              const todayStr =
                new Date()
                  .toISOString()
                  .slice(0,10);


              const todayTasks =
                tasks.filter(
                  x => x.date === todayStr
                );


              const done =
                todayTasks.filter(
                  x => x.done
                ).length;


              const pct =
                todayTasks.length
                ? Math.round(
                    done /
                    todayTasks.length *
                    100
                  )
                : 0;


              const date =
                document.getElementById(
                  "v11Date"
                );


              const bar =
                document.getElementById(
                  "v11Progress"
                );


              const text =
                document.getElementById(
                  "v11Percent"
                );


              if(date){

                date.textContent =
                  new Intl.DateTimeFormat(
                    "ar-EG",
                    {
                      weekday:"long",
                      day:"numeric",
                      month:"long"
                    }
                  ).format(
                    new Date()
                  );

              }


              if(bar){

                bar.style.width =
                  pct + "%";

              }


              if(text){

                text.textContent =
                  pct + "%";

              }


              const badge =
                document.getElementById(
                  "v11Badge"
                );


              if(badge){

                const now =
                  new Date();


                const count =
                  (
                    (window.data &&
                     data.installments) ||
                    []
                  )
                  .filter(x => {

                    const d =
                      new Date(
                        x.due || ""
                      );

                    return (
                      !isNaN(d) &&
                      d >= now &&
                      d - now <
                      4 * 86400000
                    );

                  })
                  .length;


                badge.textContent =
                  count;


                badge.style.display =
                  count
                  ? "flex"
                  : "none";

              }

            }catch(e){

              console.log(
                "V11 dashboard:",
                e
              );

            }

          }


          window.addEventListener(
            "load",
            function(){

              setTimeout(
                updateV11Dashboard,
                300
              );

            }
          );


          setInterval(
            updateV11Dashboard,
            5000
          );

          '''

          js_file.write_text(
              js,
              encoding="utf-8"
          )


          # =====================================
          # Android Version
          # =====================================

          gradle =
              app / "build.gradle"

          g =
              gradle.read_text(
                  encoding="utf-8"
              )


          g = re.sub(
              r"versionCode\s+\d+",
              "versionCode 13",
              g
          )


          g = re.sub(
              r"""versionName\s+['"][^'"]+['"]""",
              "versionName '11.0'",
              g
          )


          gradle.write_text(
              g,
              encoding="utf-8"
          )


          print(
              "V11 upgrade completed successfully."
          )

          PY


      # =========================================
      # 6. فحص JavaScript
      # =========================================

      - name: Validate JavaScript
        shell: bash
        run: |
          set -euo pipefail

          echo "Checking JavaScript..."

          node --check "$WEB_DIR/app.js"

          test -f "$WEB_DIR/index.html"
          test -f "$WEB_DIR/style.css"
          test -f "$WEB_DIR/app.js"

          grep -q "versionCode 13" \
            "$APP_DIR/build.gradle"

          grep -q "versionName '11.0'" \
            "$APP_DIR/build.gradle"

          echo ""
          echo "JavaScript validation PASSED."


      # =========================================
      # 7. التأكد من Android Manifest
      # =========================================

      - name: Validate Android project
        shell: bash
        run: |
          set -euo pipefail

          MANIFEST="$APP_DIR/src/main/AndroidManifest.xml"

          test -f "$MANIFEST"

          grep -q "MainActivity" "$MANIFEST"

          echo "Android project validation PASSED."


      # =========================================
      # 8. تحميل Gradle
      # =========================================

      - name: Install Gradle 8.7
        shell: bash
        run: |
          set -euo pipefail

          curl -fsSL \
            --retry 3 \
            -o /tmp/gradle.zip \
            https://services.gradle.org/distributions/gradle-8.7-bin.zip

          rm -rf /tmp/gradle-8.7

          unzip -q \
            /tmp/gradle.zip \
            -d /tmp

          /tmp/gradle-8.7/bin/gradle --version


      # =========================================
      # 9. بناء APK
      # =========================================

      - name: Build APK
        working-directory: ${{ env.ANDROID_ROOT }}
        shell: bash
        run: |
          set -euo pipefail

          echo "======================================"
          echo "BUILDING YAWMEYAT ELZOKSH V11"
          echo "======================================"

          /tmp/gradle-8.7/bin/gradle \
            :app:assembleDebug \
            --no-daemon \
            --stacktrace


      # =========================================
      # 10. التأكد من وجود APK
      # =========================================

      - name: Verify APK
        shell: bash
        run: |
          set -euo pipefail

          APK="$APP_DIR/build/outputs/apk/debug/app-debug.apk"

          if [ ! -f "$APK" ]; then

            echo "ERROR: APK was not created."

            echo ""
            echo "Build directory:"

            find "$APP_DIR/build" \
              -maxdepth 6 \
              -type f \
              -print \
              2>/dev/null || true

            exit 1

          fi

          echo ""
          echo "======================================"
          echo "APK CREATED SUCCESSFULLY"
          echo "======================================"

          ls -lh "$APK"


      # =========================================
      # 11. رفع APK
      # =========================================

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Yawmeyat-ElZoksh-V11
          path: ${{ env.APP_DIR }}/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
