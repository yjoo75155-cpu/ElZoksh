                      background:rgba(20,12,35,.96);
                      color:#fff;
                      border:1px solid rgba(255,255,255,.12);
                      box-shadow:0 15px 45px rgba(0,0,0,.35);
                      font-size:13px;
                      max-width:90%;
                      text-align:center;
                  `;

